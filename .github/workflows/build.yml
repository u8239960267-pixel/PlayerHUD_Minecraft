name: Build Mod
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        # Zmuszamy robota do przejścia do poprawnego katalogu przed uruchomieniem kompilacji
        run: |
          cd PlayerHUD_Fabric_1_21_4
          gradle build --no-daemon

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: PlayerHUD-Jar
          path: "PlayerHUD_Fabric_1_21_4/build/libs/*.jar"
